services:
  dropsync:
    build: .
    image: ghcr.io/abhijeetron/dropsync-pro:latest
    container_name: dropsync_pro
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REQUIRE_PIN=true
      - SHARE_PIN=948215 # Replace with your custom 6-digit PIN
    volumes:
      - dropsync_data:/app/shared_data
    # Security hardening directives
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

volumes:
  dropsync_data:
    name: dropsync_shared_vault
