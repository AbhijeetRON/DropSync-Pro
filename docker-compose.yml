services:
  dropsync:
    build: .
    image: ghcr.io/abhijeetron/dropsync-pro:latest
    container_name: dropsync_pro
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REQUIRE_PIN=true
      - SHARE_PIN=${SHARE_PIN:-} # Must be a 6-digit PIN; if omitted, DropSync auto-generates one in /data/config.json
      - DROPSYNC_DATA_DIR=/data
    volumes:
      - dropsync_data:/data
    # Hardened security: read-only rootfs with writable tmpfs and /data volume
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

volumes:
  dropsync_data:
    name: dropsync_shared_vault
